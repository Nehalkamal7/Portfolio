  <script>
    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = (e) => reject(new Error('Failed to load ' + src));
        img.src = src;
      });
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function drawWindowFrame(ctx, x, y, w, h, title) {
      // Outer shadow
      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
      ctx.shadowBlur = 40;
      ctx.shadowOffsetY = 15;
      
      // Frame background
      ctx.fillStyle = '#0b0f19';
      roundRect(ctx, x, y, w, h, 14);
      ctx.fill();
      ctx.restore();

      // Border
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.lineWidth = 1.5;
      roundRect(ctx, x, y, w, h, 14);
      ctx.stroke();

      // Top title bar
      ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      ctx.beginPath();
      ctx.moveTo(x + 14, y);
      ctx.lineTo(x + w - 14, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + 14);
      ctx.lineTo(x + w, y + 42);
      ctx.lineTo(x, y + 42);
      ctx.lineTo(x, y + 14);
      ctx.quadraticCurveTo(x, y, x + 14, y);
      ctx.closePath();
      ctx.fill();

      // Divider line
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, y + 42);
      ctx.lineTo(x + w, y + 42);
      ctx.stroke();

      // Window dots
      const dots = ['#ef4444', '#f59e0b', '#10b981'];
      dots.forEach((color, i) => {
        ctx.beginPath();
        ctx.arc(x + 22 + i * 18, y + 21, 5.5, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
      });

      // Title
      if (title) {
        ctx.font = '600 13px "JetBrains Mono", monospace';
        ctx.fillStyle = '#94a3b8';
        ctx.textAlign = 'center';
        ctx.fillText(title, x + w / 2, y + 26);
      }
    }

    async function sendToServer(canvas, filename) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(async (blob) => {
          try {
            const resp = await fetch(`http://localhost:3333/save?name=${filename}`, {
              method: 'POST',
              headers: { 'Content-Type': 'image/jpeg' },
              body: blob
            });
            const data = await resp.json();
            resolve(data);
          } catch(e) {
            reject(e);
          }
        }, 'image/jpeg', 0.96);
      });
    }
